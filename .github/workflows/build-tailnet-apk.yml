name: Build tailnet APK

# Self-contained build for the tailnet fork: no organisation secrets, no
# self-hosted runner. Generated sources are vendored in the repository, so the
# only prerequisites are Flutter 3.47.9, JDK 21, Android SDK/NDK and Rust 1.99.1.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: false
        default: tailnet
  push:
    branches: [tailnet]
    paths:
      - 'mobile/**'
      - 'native/**'
      - 'open-api/**'
      - 'i18n/**'
      - '.github/workflows/build-tailnet-apk.yml'

permissions:
  contents: write

concurrency:
  group: tailnet-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  NDK_VERSION: '28.2.13676358'

jobs:
  build:
    name: Build debug APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;${NDK_VERSION}"

      - name: Set up Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve Dart packages
        working-directory: mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: mobile
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: flutter build apk --debug --target-platform=android-arm64

      - name: Show artifact
        run: ls -lh mobile/build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-tailnet-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest tailnet debug APK
          prerelease: true
          files: mobile/build/app/outputs/flutter-apk/app-debug.apk
          body: |
            Debug APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Install with `adb install -r -t app-debug.apk`, or open the file on the
            phone (it installs as `app.alextran.immich.debug`, side by side with the
            store build).
