name: Build tailnet APK

# Self-contained build for the tailnet fork: no organisation secrets, no
# self-hosted runner. Generated sources are vendored in the repository, so the
# only prerequisites are Flutter 3.47.9, JDK 21, Android SDK/NDK and Rust 1.99.1.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: false
        default: tailnet
  push:
    branches: [tailnet]
    paths:
      - 'mobile/**'
      - 'native/**'
      - 'open-api/**'
      - 'i18n/**'
      - '.github/workflows/build-tailnet-apk.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: tailnet-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  NDK_VERSION: '28.2.13676358'

jobs:
  build:
    name: Build debug APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm cmake ninja-build pkg-config libssl-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;${NDK_VERSION}"

      - name: Set up Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve Dart packages
        working-directory: mobile
        run: flutter pub get

      - name: Environment check
        working-directory: mobile
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          ls -d "${ANDROID_NDK_HOME}" || true
          ls -1 "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/"*/bin/ 2>/dev/null | grep -E 'aarch64.*35-clang' | head -5 || true
          rustc --version || true
          cargo --version || true
          flutter doctor -v || true

      - name: Build debug APK
        working-directory: mobile
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          flutter build apk --debug --verbose --target-platform=android-arm64 2>&1 | tee /tmp/build.log

      - name: Show artifact
        run: ls -lh mobile/build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-tailnet-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach failure log to the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ -s /tmp/build.log ]; then
            tail -n 400 /tmp/build.log | cut -c1-60000 > /tmp/fail-tail.log
          else
            gh run view "${GITHUB_RUN_ID}" --log-failed > /tmp/fail.log 2>&1
            tail -n 400 /tmp/fail.log | cut -c1-60000 > /tmp/fail-tail.log
          fi
          echo "--- failure log size ---"
          wc -c /tmp/fail-tail.log
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/fail-tail.log)" || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish APK to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest tailnet debug APK
          prerelease: true
          files: mobile/build/app/outputs/flutter-apk/app-debug.apk
          body: |
            Debug APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Install with `adb install -r -t app-debug.apk`, or open the file on the
            phone (it installs as `app.alextran.immich.debug`, side by side with the
            store build).
