plugins {
  alias(libs.plugins.android.application)
  alias(libs.plugins.kotlin.android)
  id "dev.flutter.flutter-gradle-plugin"
  alias(libs.plugins.ksp)
  alias(libs.plugins.kotlin.serialization)
  alias(libs.plugins.kotlin.compose)
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
  compileSdk = flutter.compileSdkVersion
  ndkVersion = flutter.ndkVersion

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main.java.srcDirs += 'src/main/kotlin'
  }

  buildFeatures {
    buildConfig true
    compose true
  }

  defaultConfig {
    applicationId "app.alextran.immich"
    minSdk = 26
    targetSdk = flutter.targetSdkVersion
    versionCode flutter.versionCode
    versionName flutter.versionName
    resValue "string", "app_name", "照片"
    buildConfigField "boolean", "PASSKEYS", "true"
  }

  signingConfigs {
    // Fixed keys committed with the fork so every build keeps the same
    // signature and can update the previous one. Release and debug use
    // separate keys on purpose: they install as different package ids.
    debug {
      def debugStore = file("../keys/debug.jks")
      if (debugStore.exists()) {
        storeFile debugStore
        storePassword "immich-debug"
        keyAlias "immich-debug"
        keyPassword "immich-debug"
      }
    }
    release {
      def releaseStore = file("../keys/release.jks")
      if (releaseStore.exists()) {
        storeFile releaseStore
        storePassword "immich-release"
        keyAlias "immich-release"
        keyPassword "immich-release"
      } else {
        // Fallback for upstream-style CI (env vars or key.properties).
        def keyAliasVal = System.getenv("ALIAS")
        def keyPasswordVal = System.getenv("ANDROID_KEY_PASSWORD")
        def storePasswordVal = System.getenv("ANDROID_STORE_PASSWORD")

        keyAlias keyAliasVal ?: keystoreProperties['keyAlias']
        keyPassword keyPasswordVal ?: keystoreProperties['keyPassword']
        storeFile file("../key.jks").exists() ? file("../key.jks") : file(keystoreProperties['storeFile'] ?: '../key.jks')
        storePassword storePasswordVal ?: keystoreProperties['storePassword']
      }
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      versionNameSuffix '-DEBUG'
    }

    release {
      def hasFixedKey = file("../keys/release.jks").exists() && file("../keys/release.jks").length() > 0
      def hasLegacyKey = file("../key.jks").exists() && file("../key.jks").length() > 0
      signingConfig (hasFixedKey || hasLegacyKey) ? signingConfigs.release : signingConfigs.debug
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

      def prNumber = System.getenv("PR_NUMBER")
      if (prNumber) {
        applicationIdSuffix ".pr${prNumber}"
        versionNameSuffix "-pr${prNumber}"
        resValue "string", "app_name", "Immich PR ${prNumber}"
      }
    }
  }
  namespace 'app.alextran.immich'
}

flutter {
  source '../..'
}

dependencies {
  // Embedded userspace Tailscale node (mobile/android/tsbridge, built with gomobile).
  implementation files("libs/tsbridge.aar")
  implementation libs.okhttp
  implementation libs.cronet.embedded
  implementation libs.media3.datasource.okhttp
  implementation libs.media3.datasource.cronet
  implementation libs.kotlinx.coroutines.android
  implementation libs.work.runtime.ktx
  implementation libs.concurrent.futures
  implementation libs.guava
  implementation libs.glide
  implementation libs.kotlinx.serialization.json
  implementation libs.credentials
  implementation libs.credentials.play.services.auth

  ksp libs.glide.ksp
  coreLibraryDesugaring libs.desugar.jdk.libs

  //Glance Widget
  implementation libs.glance.appwidget
  implementation libs.gson

  // Glance Configure
  implementation libs.activity.compose
  implementation libs.compose.ui
  implementation libs.compose.ui.tooling
  implementation libs.compose.material3
  implementation libs.lifecycle.runtime.ktx
  implementation libs.material
}

